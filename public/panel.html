<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitoreo - Laravel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
            min-height: 100vh;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .card h2 {
            color: #4ade80;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        pre {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #cbd5e1;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .status-item {
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }
        .status-item .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .status-item .value { font-size: 18px; font-weight: bold; color: #e2e8f0; }
    </style>
</head>
<body>
    <h1>📊 Panel de Monitoreo - Laravel</h1>
    <p class="subtitle">Actualización automática cada 15 segundos</p>

    <div class="status-bar">
        <div class="status-item">
            <div class="label">Última actualización</div>
            <div class="value" id="lastUpdate">--:--:--</div>
        </div>
        <div class="status-item">
            <div class="label">Endpoint de Métricas</div>
            <div class="value">/metrics</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Disponibilidad (Últimos registros)</h2>
            <pre id="disponibilidad">Cargando...</pre>
        </div>

        <div class="card">
            <h2>Métricas de Laravel</h2>
            <pre id="metricas">Cargando...</pre>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            const ahora = new Date().toLocaleTimeString();
            document.getElementById('lastUpdate').textContent = ahora;

            // 1. Cargar Disponibilidad (desde el log)
            try {
                const res = await fetch('/monitoreo-log');
                const texto = await res.text();
                const lineas = texto.trim().split('\n').slice(-10).join('\n');
                document.getElementById('disponibilidad').textContent = lineas || 'Sin registros aún. Ejecuta ./monitoreo.sh';
            } catch(e) {
                document.getElementById('disponibilidad').textContent = 'No disponible';
            }

            // 2. Cargar Métricas (Si tienes instalado spatie/laravel-prometheus)
            try {
                const res = await fetch('/metrics');
                const texto = await res.text();
                const lineas = texto.split('\n')
                    .filter(l => l.includes('laravel') || l.includes('app_'))
                    .slice(0, 20)
                    .join('\n');
                document.getElementById('metricas').textContent = lineas || 'Sin métricas. Instala spatie/laravel-prometheus.';
            } catch(e) {
                document.getElementById('metricas').textContent = 'Endpoint /metrics no disponible.';
            }
        }

        cargarDatos();
        setInterval(cargarDatos, 15000);
    </script>
</body>
</html>

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_sqlite, sqlite3
        coverage: none

    - name: Copiar archivo de entorno
      run: cp .env.example .env

    - name: Instalar dependencias de Composer
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Generar llave de la aplicación
      run: php artisan key:generate

    - name: Ejecutar Análisis Estático (PHPStan)
      run: vendor/bin/phpstan analyse --configuration=phpstan.neon

    - name: Ejecutar Pruebas (PHPUnit)
      run: php artisan test